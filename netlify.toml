[build]
  publish = "site"
  command = "npm run build && npm test"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API rewrites must precede the client-side /learn route.
[[redirects]]
  from = "/api/product-sets/:setId"
  to = "/.netlify/functions/product-sets?setId=:setId"
  status = 200

[[redirects]]
  from = "/api/recognize"
  to = "/.netlify/functions/recognize"
  status = 200

[[redirects]]
  from = "/api/compose"
  to = "/.netlify/functions/compose"
  status = 200

[[redirects]]
  from = "/api/dictionary-index"
  to = "/.netlify/functions/dictionary-index"
  status = 200

[[redirects]]
  from = "/api/dictionary"
  to = "/.netlify/functions/dictionary"
  status = 200

[[redirects]]
  from = "/learn"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
